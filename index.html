<style>

<body>
<div id="app"></div>
<script type="module">
/* ---------------- mini mastery engine (mirrors backend/app/engine.py) ---------------- */
const MASTERY=0.95;
function bkt(p,correct,prm){
  const {slip,guess,transit}=prm;
  let num,den;
  if(correct){num=p*(1-slip);den=num+(1-p)*guess;}
  else{num=p*slip;den=num+(1-p)*(1-guess);}
  const cond=den>0?num/den:p;
  return cond+(1-cond)*transit;
}
function tier(p){return p<0.4?'easy':p<0.8?'core':'hard';}
function mastered(p,hardOk){return p>=MASTERY && hardOk;}

/* ---------------- sound engine (Web Audio, no files) ---------------- */
let AC=null, MUTED=false;
function ac(){if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(freq,dur,type='sine',vol=0.18,delay=0){
  if(MUTED)return;const a=ac();if(!a)return;
  const t=a.currentTime+delay;
  const o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur);
}
const SFX={
  correct(){tone(523,0.12,'sine',0.16);tone(784,0.18,'sine',0.16,0.1);},
  star(){tone(880,0.08,'triangle',0.14);tone(1318,0.14,'triangle',0.14,0.07);},
  wrong(){tone(311,0.18,'sine',0.12);tone(247,0.22,'sine',0.12,0.12);},
  mastery(){[523,659,784,1046].forEach((f,i)=>tone(f,0.22,'triangle',0.16,i*0.11));},
  adopt(){[659,784,988,1318].forEach((f,i)=>tone(f,0.18,'sine',0.15,i*0.08));},
  tap(){tone(660,0.05,'square',0.06);},
};

/* ---------------- content (mirrors backend/app/content.py) ---------------- */
const PRM={slip:0.10,guess:0.20,transit:0.17};
const MIS={
 M1:{lead:"Great job reading the minutes!",teach:"The hour hand is close to the next number, but the hour doesn't change until the long hand reaches 12. We're still finishing this hour."},
 M2:{lead:"Nice try!",teach:"The SHORT fat hand tells the hour, the LONG thin hand tells the minutes. Look at the short one for the hour."},
 M3:{lead:"Good eye on the number!",teach:"Each number counts 5 minutes. Let's count by 5s: 5, 10, 15, 20…"},
 M4:{lead:"You found the right hand!",teach:"Each step is 5 minutes, not 1. Count by 5s with me."},
 M5:{lead:"Look closely!",teach:"The short hand has almost reached the next number — but not yet. The minutes tell us we're near the end of this hour."},
 M6:{lead:"Careful!",teach:"A quarter of an HOUR is 15 minutes, not 25. 60 ÷ 4 = 15."},
};
const SKILLS=[
 {key:'hour-on-hour',name:"O'clock times",prereq:[],hard:false,pinit:.30},
 {key:'half-hour',name:"Half past",prereq:['hour-on-hour'],hard:false,pinit:.20},
 {key:'five-min',name:"Five-minute times",prereq:['hour-on-hour'],hard:false,pinit:.15},
 {key:'current-hour',name:"Current hour",prereq:['half-hour'],hard:false,pinit:.15},
 {key:'near-next-hour',name:"Near the next hour",prereq:['current-hour'],hard:true,pinit:.10},
 {key:'quarter-hours',name:"Quarter past & to",prereq:['five-min','half-hour'],hard:false,pinit:.12},
 {key:'daily-schedule',name:"Daily schedule times",prereq:['quarter-hours','near-next-hour'],hard:false,pinit:.15,phase3:true},
 {key:'am-pm',name:"Morning or night (AM/PM)",prereq:['daily-schedule'],hard:false,pinit:.15,phase3:true},
 {key:'match-activity',name:"Match the activity",prereq:['daily-schedule'],hard:false,pinit:.15,phase3:true},
];
const fmt=(h,m)=>`${h}:${String(m).padStart(2,'0')}`;
const nh=h=>h===12?1:h+1;
function buildItems(){
 const I=[];let id=1;
 const add=(skill,t,h,m,prompt,ds,extra={})=>{const opts=[{v:fmt(h,m),c:true,mis:null}];const seen=new Set([fmt(h,m)]);
   ds.forEach(([v,mis])=>{if(!seen.has(v)){seen.add(v);opts.push({v,c:false,mis});}});
   I.push({id:id++,skill,tier:t,h,m,prompt,correct:fmt(h,m),opts,context:extra.context||null,noClock:!!extra.noClock,emoji:extra.emoji||null});};
 // generic add for word-answer items (options are plain text, not times)
 const addText=(skill,t,h,m,prompt,correctText,wrongTexts,extra={})=>{const opts=[{v:correctText,c:true,mis:null}];
   wrongTexts.forEach(w=>opts.push({v:w,c:false,mis:null}));
   I.push({id:id++,skill,tier:t,h,m,prompt,correct:correctText,opts,context:extra.context||null,noClock:!!extra.noClock,emoji:extra.emoji||null});};
 [1,4,7,10,2,5,8,11].forEach(h=>add('hour-on-hour','easy',h,0,"What time is it?",[[fmt(nh(h),0),'M1'],[fmt(12,(h*5)%60),'M2'],[fmt(h,30),null]]));
 [1,3,6,8,10,12].forEach(h=>add('half-hour','core',h,30,"What time is it?",[[fmt(nh(h),30),'M1'],[fmt(h,0),null],[fmt(h,6),'M4']]));
 [[3,20],[7,25],[10,40],[2,10],[5,35],[8,50]].forEach(([h,m])=>add('five-min','core',h,m,"What time is it?",[[fmt(Math.floor(m/5),m),'M3'],[fmt(h,Math.floor(m/5)),'M4'],[fmt(h,(m+5)%60),null]]));
 [[2,25],[5,15],[8,45],[11,20]].forEach(([h,m])=>add('current-hour','core',h,m,"What time is it?",[[fmt(nh(h),m),'M1'],[fmt(h,Math.floor(m/5)),'M4'],[fmt(12,m),'M2']]));
 [[6,55],[3,50],[9,55],[1,50],[4,55],[7,50]].forEach(([h,m])=>add('near-next-hour','hard',h,m,"Look closely at the hour hand. What time is it?",[[fmt(nh(h),m),'M1'],[fmt(nh(h),0),'M5'],[fmt(h,Math.floor(m/5)),'M4']]));
 [[3,15],[8,45],[5,15],[11,45]].forEach(([h,m])=>add('quarter-hours','core',h,m,"What time is shown?",[[fmt(h,25),'M6'],[fmt(h,30),null],[fmt(nh(h),m),'M1']]));
 // --- Phase 3: real-life time (clock shown, real-world framing) ---
 add('daily-schedule','core',8,0,"School starts. What time is it?",[[fmt(9,0),'M1'],[fmt(12,40),'M2'],[fmt(8,30),null]],{context:"🏫 The school bell rings!",emoji:"🏫"});
 add('daily-schedule','core',12,30,"It's lunchtime! What time is it?",[[fmt(1,30),'M1'],[fmt(12,6),'M4'],[fmt(12,0),null]],{context:"🍎 Time for lunch",emoji:"🍎"});
 add('daily-schedule','core',3,15,"Soccer practice begins. What time?",[[fmt(3,25),'M6'],[fmt(4,15),'M1'],[fmt(3,30),null]],{context:"⚽ Soccer practice",emoji:"⚽"});
 add('daily-schedule','core',7,45,"Bedtime story time. What time?",[[fmt(7,25),'M6'],[fmt(8,45),'M1'],[fmt(8,0),null]],{context:"📖 Bedtime story",emoji:"📖"});
 add('daily-schedule','core',10,20,"Snack break at school. What time?",[[fmt(10,4),'M4'],[fmt(11,20),'M1'],[fmt(4,20),'M3']],{context:"🥨 Snack time",emoji:"🥨"});
 // --- Phase 3: AM / PM (text answers) ---
 addText('am-pm','core',7,0,"You eat breakfast at 7:00. Is that morning or night?","Morning (AM)",["Night (PM)"],{context:"🥞 Breakfast time!",emoji:"🥞",noClock:false});
 addText('am-pm','core',8,30,"You brush your teeth before bed at 8:30. Morning or night?","Night (PM)",["Morning (AM)"],{context:"🌙 Before bed",emoji:"🌙"});
 addText('am-pm','core',12,0,"The sun is highest and it's lunchtime. Is 12:00 noon or midnight?","Noon (PM)",["Midnight (AM)"],{context:"☀️ Sun overhead",emoji:"☀️"});
 addText('am-pm','core',6,0,"Birds start singing as the sun rises at 6:00. Morning or night?","Morning (AM)",["Night (PM)"],{context:"🐦 Sunrise",emoji:"🐦"});
 // --- Phase 3: match the activity (no clock; read time, pick activity) ---
 addText('match-activity','core',8,0,"The clock says 8:00 in the morning. What are you most likely doing?","Going to school","Sleeping at night,Eating dinner".split(","),{context:"🕗 It's 8:00 AM",emoji:"🕗"});
 addText('match-activity','core',6,30,"It's 6:30 in the evening. What fits best?","Eating dinner","Waking up,Recess at school".split(","),{context:"🕡 It's 6:30 PM",emoji:"🍽️"});
 addText('match-activity','core',3,0,"It's 3:00 in the afternoon. What fits best?","School is ending","Eating breakfast,Sleeping".split(","),{context:"🕒 It's 3:00 PM",emoji:"🎒"});
 return I;
}
const ITEMS=buildItems();
const ANIMALS=[
 {k:'puppy',e:'🐶',n:'Puppy',cost:3},{k:'penguin',e:'🐧',n:'Penguin',cost:5},
 {k:'guineapig',e:'🐹',n:'Guinea Pig',cost:6},{k:'hedgehog',e:'🦔',n:'Hedgehog',cost:8},
 {k:'fox',e:'🦊',n:'Fox',cost:10},{k:'owl',e:'🦉',n:'Owl',cost:12},
 {k:'koala',e:'🐨',n:'Koala',cost:15},{k:'redpanda',e:'🦝',n:'Red Panda',cost:18},
 {k:'dolphin',e:'🐬',n:'Dolphin',cost:25},{k:'turtle',e:'🐢',n:'Sea Turtle',cost:35},
 {k:'leopard',e:'🐆',n:'Snow Leopard',cost:40},
];

/* ---------------- state ---------------- */
const S={
  screen:'onboard', theme:'ocean', sanctuary:'', starter:'puppy',
  stars:0, adopted:[], sessionCount:0, timeMs:0, streak:0,
  skill:{}, // key -> {p,hardOk,mastered}
  misc:{},  // mid -> {hits,open}
  recent:[], current:null, answered:null, startTs:0,
};
SKILLS.forEach(s=>S.skill[s.key]={p:s.pinit,hardOk:false,mastered:false});

function unlocked(key){const s=SKILLS.find(x=>x.key===key);return s.prereq.every(p=>S.skill[p].mastered);}
function selectNext(){
  let best=null,bestScore=-1e9;
  for(const s of SKILLS){
    const st=S.skill[s.key];
    if(!unlocked(s.key)||st.mastered)continue;
    const gov=govMis(s.key);
    const open=gov.some(m=>S.misc[m]&&S.misc[m].open);
    let score=Math.max(0,MASTERY-st.p)+ (open?2:0) - (S.recent.includes(s.key)?1:0);
    if(st.p>=0.6&&st.p<0.95)score+=0.5;
    if(score>bestScore){bestScore=score;best=s.key;}
  }
  if(!best)return null;
  const t=tier(S.skill[best].p);
  let pool=ITEMS.filter(i=>i.skill===best&&i.tier===t);
  if(!pool.length)pool=ITEMS.filter(i=>i.skill===best);
  return pool[Math.floor(Math.random()*pool.length)];
}
function govMis(key){return{'hour-on-hour':['M2','M5'],'half-hour':['M1','M5'],'five-min':['M3','M4'],'current-hour':['M1','M5'],'near-next-hour':['M1','M5'],'quarter-hours':['M6'],'daily-schedule':['M1','M6'],'am-pm':[],'match-activity':[]}[key]||[];}

/* ---------------- clock renderer ---------------- */
function clockSVG(h,m,size=250){
  const c=size/2,r=c-8;
  const ma=(m/60)*360, ha=((h%12)/12)*360+(m/60)*30;
  const hand=(deg,len)=>{const a=(deg-90)*Math.PI/180;return[c+len*Math.cos(a),c+len*Math.sin(a)];};
  const [mx,my]=hand(ma,r*0.78),[hx,hy]=hand(ha,r*0.5);
  let ticks='';
  for(let i=0;i<60;i++){const a=(i*6-90)*Math.PI/180,big=i%5===0,inn=r-(big?16:8);
    ticks+=`<line x1="${c+inn*Math.cos(a)}" y1="${c+inn*Math.sin(a)}" x2="${c+r*Math.cos(a)}" y2="${c+r*Math.sin(a)}" stroke="${big?'var(--clock-tick)':'var(--clock-tick-minor)'}" stroke-width="${big?3:1.5}" stroke-linecap="round"/>`;}
  let nums='';
  for(let n=1;n<=12;n++){const a=(n*30-90)*Math.PI/180,nr=r-34;
    nums+=`<text x="${c+nr*Math.cos(a)}" y="${c+nr*Math.sin(a)}" text-anchor="middle" dominant-baseline="central" font-size="${size*0.1}" font-weight="700" fill="var(--clock-numeral)" font-family="var(--font-display)">${n}</text>`;}
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" role="img" aria-label="Clock showing ${fmt(h,m)}">
    <circle cx="${c}" cy="${c}" r="${r}" fill="var(--clock-face)" stroke="var(--clock-ring)" stroke-width="6"/>
    ${ticks}${nums}
    <line x1="${c}" y1="${c}" x2="${mx}" y2="${my}" stroke="var(--minute-hand)" stroke-width="5" stroke-linecap="round"/>
    <line x1="${c}" y1="${c}" x2="${hx}" y2="${hy}" stroke="var(--hour-hand)" stroke-width="9" stroke-linecap="round"/>
    <circle cx="${c}" cy="${c}" r="9" fill="var(--clock-hub)"/></svg>`;
}

/* ---------------- render ---------------- */
const app=document.getElementById('app');
function setTheme(){document.body.className=S.theme==='ocean'?'':'theme-'+S.theme;}
function confetti(){const ems=['⭐','🎉','✨','🌟'];for(let i=0;i<24;i++){const d=document.createElement('div');d.className='confetti';d.textContent=ems[i%4];d.style.left=Math.random()*100+'vw';d.style.animationDelay=(Math.random()*.4)+'s';document.body.appendChild(d);setTimeout(()=>d.remove(),2000);}}

function render(){
  setTheme();
  if(S.screen==='onboard')return renderOnboard();
  if(S.screen==='play')return renderPlay();
  if(S.screen==='home')return renderHome();
  if(S.screen==='parent')return renderParent();
}

function renderOnboard(){
  app.innerHTML=`<div class="card">
    <h1 class="center" style="color:var(--bg2);font-size:30px;">🐊 Alli's Time Tails</h1>
    <p class="center" style="margin:8px 0 2px;font-family:var(--font-display);font-size:17px;color:var(--accent2);">Hi, I'm Alli! 🐊</p>
    <p class="center muted" style="margin:2px 0 4px;">Learn to tell time with me and build your own animal sanctuary!</p>
    <label class="label">Name your sanctuary</label>
    <input id="san" class="field" placeholder="e.g. Sunny Meadow" value="${S.sanctuary}"/>
    <label class="label">Pick a theme</label>
    <div class="h-row">
      ${['ocean','forest','berry'].map(t=>`<div class="swatch" data-theme="${t}" style="background:${t==='ocean'?'#2a9fd6':t==='forest'?'#3aa66a':'#c44fa0'};outline:${S.theme===t?'3px solid var(--ink)':'none'}"></div>`).join('')}
    </div>
    <label class="label">Choose your starter friend</label>
    <div class="pick-grid">
      ${ANIMALS.slice(0,6).map(a=>`<div class="pick ${S.starter===a.k?'sel':''}" data-an="${a.k}">${a.e}<small>${a.n}</small></div>`).join('')}
    </div>
    <button class="btn" id="start">Start my sanctuary →</button>
  </div>`;
  app.querySelectorAll('.swatch').forEach(el=>el.onclick=()=>{S.theme=el.dataset.theme;render();});
  app.querySelectorAll('[data-an]').forEach(el=>el.onclick=()=>{S.starter=el.dataset.an;render();});
  document.getElementById('san').oninput=e=>S.sanctuary=e.target.value;
  document.getElementById('start').onclick=()=>{
    if(!S.sanctuary.trim())S.sanctuary='My Sanctuary';
    S.adopted.push(S.starter);S.screen='play';nextQuestion();
  };
}

function nextQuestion(){
  S.current=selectNext();S.answered=null;S.startTs=Date.now();
  if(!S.current){S.screen='home';}
  render();
}

function renderPlay(){
  const it=S.current;
  const wide=it.opts.some(o=>o.v.length>6); // text answers need full-width buttons
  app.innerHTML=`
   <div class="topbar">
     <div style="font-family:var(--font-display);font-weight:600;font-size:18px;">${S.sanctuary}</div>
     <div style="display:flex;gap:8px;align-items:center;">
       <button class="muteBtn" id="mute" aria-label="sound">${MUTED?'🔇':'🔊'}</button>
       <div class="stars" id="starbox">⭐ <span id="starnum">${S.stars}</span></div>
     </div>
   </div>
   <div class="card">
     ${it.context?`<div class="context">${it.context}</div>`:''}
     <div class="prompt">${it.prompt}</div>
     ${it.noClock?'':`<div class="clockwrap">${clockSVG(it.h,it.m)}</div>`}
     <div class="opts ${wide?'opts-wide':''}" id="opts">
       ${it.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o.v}</button>`).join('')}
     </div>
     <div id="fb"></div>
   </div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{SFX.tap();answer(parseInt(b.dataset.i));});
  document.getElementById('mute').onclick=()=>{MUTED=!MUTED;if(!MUTED){ac();SFX.tap();}render();};
}

function bumpStars(to){
  const el=document.getElementById('starnum'),box=document.getElementById('starbox');
  if(!el){return;}
  box.classList.add('pop');setTimeout(()=>box&&box.classList.remove('pop'),400);
  let cur=parseInt(el.textContent)||0;
  const step=()=>{if(cur<to){cur++;el.textContent=cur;SFX.star();if(cur<to)setTimeout(step,140);}};
  step();
}

function answer(i){
  if(S.answered!==null)return;
  const it=S.current,opt=it.opts[i],correct=opt.c;
  S.answered=i;
  const rt=Date.now()-S.startTs;
  const prm=PRM;
  const st=S.skill[it.skill];
  st.p=bkt(st.p,correct,prm);
  if(correct&&it.tier==='hard')st.hardOk=true;
  const gateOk=st.hardOk||!SKILLS.find(s=>s.key===it.skill).hard;

  // per-question stars: +1, or +2 for a hard item; mastery adds a bonus
  let earned=0, justMastered=false;
  if(correct){
    earned = it.tier==='hard'?2:1;
    S.streak=(S.streak||0)+1;
    if(mastered(st.p,gateOk)&&!st.mastered){st.mastered=true;justMastered=true;earned+=3;}
  }else{
    S.streak=0;
  }
  S.stars+=earned;
  S.recent=[it.skill,...S.recent].slice(0,2);
  S.timeMs+=rt;

  // misconception tracking (skip if it was a text answer with no mis)
  let teach=null;
  if(!correct&&opt.mis){
    const m=S.misc[opt.mis]||{hits:0,open:false};
    m.hits++;if(m.hits>=2)m.open=true;S.misc[opt.mis]=m;
    teach=MIS[opt.mis];
  }
  if(correct&&it.tier==='hard')govMis(it.skill).forEach(mid=>{if(S.misc[mid])S.misc[mid].open=false;});

  // paint buttons
  const btns=app.querySelectorAll('.opt');
  btns.forEach((b,idx)=>{
    if(it.opts[idx].c)b.classList.add('correct');
    else if(idx===i)b.classList.add('wrong');
    else b.classList.add('dim');
    b.disabled=true;
  });

  const fb=document.getElementById('fb');
  if(correct){
    if(justMastered){SFX.mastery();confetti();} else {SFX.correct();}
    if(earned>0)setTimeout(()=>bumpStars(S.stars),200);
    const streakMsg = S.streak>=3?` 🔥 ${S.streak} in a row!`:'';
    const lead = justMastered?'🌟 Skill mastered!'
               : pick(['🐊 Yes!','🐊 You got it!','🐊 Nice work!','🐊 Snappy!']);
    const body = justMastered
      ? `You mastered "${SKILLS.find(s=>s.key===it.skill).name}"! +3 bonus stars to adopt animals.`
      : `That's ${it.correct}. +${earned} ⭐${streakMsg}`;
    fb.innerHTML=`<div class="teach" style="background:#eafaf1;border-color:var(--good);">
      <span class="lead" style="color:var(--good);">${lead}</span>${body}</div>
      <button class="btn" id="next">Next →</button>`;
  }else{
    SFX.wrong();
    const ans = it.noClock?`The answer is "${it.correct}".`:('The correct time is '+it.correct+'. Look at the short hour hand and the long minute hand.');
    fb.innerHTML=`<div class="teach">
      <span class="lead">🐊 ${teach?teach.lead:'Almost — look with me!'}</span>
      ${teach?teach.teach:ans}
      </div>
      <button class="btn" id="retry">Try again →</button>`;
  }
  S.sessionCount++;
  const nb=document.getElementById('next')||document.getElementById('retry');
  nb.onclick=()=>{
    SFX.tap();
    if(S.sessionCount>=8){S.screen='home';render();}
    else nextQuestion();
  };
}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

function renderHome(){
  S.sessionCount=0;
  app.innerHTML=`
   <div class="topbar"><div style="font-family:var(--font-display);font-weight:600;font-size:18px;">${S.sanctuary}</div><div class="stars">⭐ ${S.stars}</div></div>
   <div class="tabs">
     <div class="tab active">Sanctuary</div>
     <div class="tab" id="toParent">Parent</div>
   </div>
   <div class="card">
     <div class="sanctuary">${S.adopted.map(k=>`<span class="animal-big">${ANIMALS.find(a=>a.k===k).e}</span>`).join('')||'<span class="muted">No animals yet — play to earn stars!</span>'}</div>
     <h3 style="color:var(--bg2);">Adopt an animal</h3>
     <p class="muted">Spend ⭐ stars to welcome a new friend.</p>
     <div class="shop">
       ${ANIMALS.map(a=>{const owned=S.adopted.filter(x=>x===a.k).length;const can=S.stars>=a.cost;
         return `<div class="shopitem ${can?'':'locked'}" data-adopt="${a.k}">
           <div class="em">${a.e}</div><div style="font-weight:800;">${a.n}</div>
           <div class="cost">⭐ ${a.cost}</div>${owned?`<div class="muted">×${owned}</div>`:''}</div>`;}).join('')}
     </div>
     <button class="btn" id="play">▶ Play a session</button>
   </div>`;
  app.querySelector('#toParent').onclick=()=>{S.screen='parent';render();};
  app.querySelector('#play').onclick=()=>{S.sessionCount=0;nextQuestion();};
  app.querySelectorAll('[data-adopt]').forEach(el=>el.onclick=()=>{
    const a=ANIMALS.find(x=>x.k===el.dataset.adopt);
    if(S.stars>=a.cost){S.stars-=a.cost;S.adopted.push(a.k);SFX.adopt();confetti();render();}
  });
}

function renderParent(){
  const masteredS=SKILLS.filter(s=>S.skill[s.key].mastered);
  const inprog=SKILLS.filter(s=>!S.skill[s.key].mastered&&unlocked(s.key));
  const open=Object.entries(S.misc).filter(([,v])=>v.open).map(([k])=>k);
  const PT={M1:"Reads the hour as the number the short hand is closest to.",M2:"Mixes up the long and short hands.",M3:"Reads the number the minute hand points to instead of counting by 5.",M4:"Counts by ones instead of fives.",M5:"Doesn't notice the hour hand has nearly reached the next number.",M6:"Thinks a quarter hour is 25 minutes."};
  const TAH={M1:"Ask whether it's still this hour or the next one.",M2:"Short fat hand = hours, long thin hand = minutes.",M3:"Count around the clock by 5s.",M4:"Skip-count by 5 to 60.",M5:"Compare a clock at :05 and :55.",M6:"A quarter HOUR is 15 minutes; a quarter DOLLAR is 25 cents."};
  app.innerHTML=`
   <div class="topbar"><div style="font-family:var(--font-display);font-weight:600;font-size:18px;">Parent View</div><div class="stars">⭐ ${S.stars}</div></div>
   <div class="tabs"><div class="tab" id="toHome">Sanctuary</div><div class="tab active">Parent</div></div>
   <div class="card">
     <h3 style="color:var(--bg2);">Progress for ${S.sanctuary}</h3>
     <div class="stat"><span>Time spent learning</span><b>${(S.timeMs/60000).toFixed(1)} min</b></div>
     <div class="stat"><span>Skills mastered</span><b>${masteredS.length} / ${SKILLS.length}</b></div>

     <h3 style="margin-top:16px;color:var(--bg2);font-size:18px;">Mastered</h3>
     ${masteredS.length?masteredS.map(s=>`<span class="pill">${s.name}</span>`).join(''):'<p class="muted">None yet — that\'s okay! Learning takes time.</p>'}

     <h3 style="margin-top:16px;color:var(--bg2);font-size:18px;">In progress</h3>
     ${inprog.map(s=>`<div style="margin-top:10px;"><div style="display:flex;justify-content:space-between;"><span>${s.name}</span><span class="muted">${pctLabel(S.skill[s.key].p)}</span></div><div class="progressbar"><i style="width:${Math.round(S.skill[s.key].p*100)}%"></i></div></div>`).join('')}

     <h3 style="margin-top:18px;color:var(--bg2);font-size:18px;">What to focus on</h3>
     ${open.length?open.map(m=>`<div class="teach" style="margin-top:10px;"><span class="lead">${PT[m]}</span>Try at home: ${TAH[m]}</div>`).join(''):'<p class="muted">No recurring misconceptions detected. Great sign!</p>'}
     <button class="btn ghost" id="back" style="margin-top:18px;">← Back to sanctuary</button>
   </div>`;
  app.querySelector('#toHome').onclick=()=>{S.screen='home';render();};
  app.querySelector('#back').onclick=()=>{S.screen='home';render();};
}
function pctLabel(p){return p<0.4?'Getting started':p<0.7?'Building':p<0.95?'Almost there':'Mastered';}

render();
</script>
</body>
</html>
